name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BLENDER_ARCHIVE: blender-4.3.2-linux-x64.tar.xz
      BLENDER_SHA256: 4da1c956673c0485e63054e563ee69198cc8f80d8157dd7592dffc8a6a5592e6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install drawing dependency
        run: python -m pip install -r requirements.txt
      - name: Check published assets
        run: python -m unittest discover -s tests -v
      - name: Install Blender and headless drawing support
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxi6 libxrender1 libxfixes3 libxkbcommon0 libegl1 libgl1 libsm6 fonts-dejavu-core
          curl --proto '=https' --tlsv1.2 -fsSL "https://download.blender.org/release/Blender4.3/$BLENDER_ARCHIVE" -o "$RUNNER_TEMP/$BLENDER_ARCHIVE"
          echo "$BLENDER_SHA256  $RUNNER_TEMP/$BLENDER_ARCHIVE" | sha256sum --check --strict
          tar -xf "$RUNNER_TEMP/$BLENDER_ARCHIVE" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-4.3.2-linux-x64" >> "$GITHUB_PATH"
      - name: Build preview scene from scratch
        run: MEMPHIS_DRAFT=1 blender --python-exit-code 1 -b --python build_memphis.py
      - name: Audit source geometry and mounting dimensions
        run: blender --python-exit-code 1 -b output/Memphis_Artisans.blend --python validate_memphis.py
      - name: Regenerate overview drawings
        run: |
          xvfb-run -a blender --python-exit-code 1 -b output/Memphis_Artisans.blend --python render_drawings.py
          python compose_drawings.py
      - name: Export joined print meshes
        run: blender --python-exit-code 1 -b output/Memphis_Artisans.blend --python export_prints.py
      - name: Check regenerated assets
        run: python -m unittest discover -s tests -v
